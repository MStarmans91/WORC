version: 2

sphinx:
  configuration: WORC/doc/conf.py

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"
  commands:
    # Ensure pip is modern
    - pip install --upgrade pip setuptools wheel
    # Install pyradiomics without build isolation so numpy is visible
    - pip install --no-build-isolation pyradiomics==3.0.1

python:
  install:
    - requirements: WORC/doc/requirements-pre-numpy.txt
    - requirements: WORC/doc/requirements.txt
    - method: pip
      path: .
